<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da TV</title>
<style>
*{-webkit-box-sizing:border-box;box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0c1118;color:#f3f6fb;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
.grid{height:100%;display:-webkit-flex;display:flex;padding:2vw}
.lc{-webkit-flex:1.3;flex:1.3;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-width:0;margin-right:1.6vw}
.side{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-height:0;min-width:0}
.card{background:#161d28;border-radius:1.6vw;padding:1.8vw;min-height:0;overflow:hidden}
h2{margin:0 0 1vw;font-size:1.5vw;letter-spacing:.06em;font-weight:700;-webkit-flex:none;flex:none}
.box{-webkit-flex:1;flex:1;min-height:0;overflow:hidden;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.box>div{width:100%}
.top{-webkit-flex:none;flex:none;height:31vh;margin-bottom:1.6vw;display:-webkit-flex;display:flex;-webkit-align-items:stretch;align-items:stretch}
.tl{-webkit-flex:none;flex:none;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-justify-content:center;justify-content:center;margin-right:2vw}
#time{font-size:8vw;font-weight:700;line-height:1;letter-spacing:-.02em}
#date{font-size:1.9vw;color:#8d99ab;margin-top:.6vw}
#greet{font-size:1.5vw;color:#5ab0ff;margin-top:.4vw}
.verse{-webkit-flex:1;flex:1;min-width:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;border-left:1px solid #243041;padding-left:2vw}
#vtx{line-height:1.3;font-weight:700}
#vrf{color:#8d99ab;margin-top:.5em;font-size:.8em}
.trn{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.trn h2{color:#5ab0ff}
#tfb{-webkit-flex:1;flex:1;min-height:0;overflow:hidden}
.tf{display:-webkit-flex;display:flex;-webkit-align-items:flex-start;align-items:flex-start;padding:.5vw .3vw;border-bottom:1px solid #243041}
.tf span{-webkit-flex:1;flex:1;line-height:1.25}
.ck{-webkit-flex:none;flex:none;width:.9em;height:.9em;border:.12em solid #5ab0ff;border-radius:.2em;margin-right:.6em;margin-top:.18em;text-align:center;font-size:1em;line-height:.8em;color:#0c1118;font-weight:700}
.tf.done{opacity:.4}
.tf.done span{text-decoration:line-through}
.tf.done .ck{background:#5ab0ff}
.side .card{margin-bottom:1.6vw}
.side .card:last-child{margin-bottom:0}
.photo{-webkit-flex:1.5;flex:1.5;position:relative;padding:0;background:#000}
.ph{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;-webkit-transition:opacity 1.2s;transition:opacity 1.2s;overflow:hidden}
.ph.on{opacity:1}
.ph .bg{position:absolute;top:-6%;left:-6%;width:112%;height:112%;background-position:center;background-size:cover;background-repeat:no-repeat;-webkit-filter:blur(28px) brightness(.5);filter:blur(28px) brightness(.5)}
.ph .fg{position:absolute;top:0;left:0;width:100%;height:100%;background-position:center;background-size:contain;background-repeat:no-repeat}
.noph{position:absolute;top:0;left:0;width:100%;height:100%;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;color:#8d99ab;font-size:1.6vw;text-align:center;padding:2vw}
.rec,.tema{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.rec{-webkit-flex:1.4;flex:1.4}.tema{-webkit-flex:.9;flex:.9}
.rec h2{color:#ffd166}
.tema h2{color:#9be0a8}
.ln{font-weight:700;line-height:1.3;margin-bottom:.35em}
.muted{color:#8d99ab;font-weight:400}
#tm{font-weight:700;line-height:1.25}
.tools{position:fixed;right:.8vw;bottom:.8vw;opacity:.15;z-index:5}
.tools:hover{opacity:1}
.tools button{background:#222c3b;color:#f3f6fb;border:0;border-radius:8px;font-size:22px;padding:6px 12px;margin-left:6px;cursor:pointer}
#dlgw{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:10}
#dlgb{background:#171f2b;color:#f3f6fb;border:1px solid #2b3849;border-radius:16px;padding:22px;width:90%;max-width:620px;margin:10vh auto 0}
#dlgb p{color:#8d99ab;font-size:15px;line-height:1.5;margin:8px 0}
input{width:100%;background:#0f151e;color:#f3f6fb;border:1px solid #2b3849;border-radius:8px;padding:10px;font-size:16px;margin-top:6px}
.btns{margin-top:14px}
.btns button{background:#2a3a52;color:#f3f6fb;border:0;border-radius:8px;padding:10px 16px;margin-right:10px;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="grid">
  <div class="lc">
    <section class="card top">
      <div class="tl"><div id="time">--:--</div><div id="date"></div><div id="greet"></div></div>
      <div class="verse"><div class="box" id="vbox"><div id="vin"><div id="vtx"></div><div id="vrf"></div></div></div></div>
    </section>
    <section class="card trn"><h2>TAREFAS IMPORTANTES</h2><div id="tfb"><div id="tfi"></div></div></section>
  </div>
  <div class="side">
    <section class="card photo"><div class="ph on" id="pa"><div class="bg"></div><div class="fg"></div></div><div class="ph" id="pb"><div class="bg"></div><div class="fg"></div></div><div class="noph" id="nop">Sem fotos ainda.<br>Adicione links na planilha (tipo: foto).</div></section>
    <section class="card rec"><h2>TREINO DE HOJE</h2><div class="box" id="trb"><div id="tri"></div></div></section>
    <section class="card tema"><h2>PRÓXIMA ADORAÇÃO EM FAMÍLIA</h2><div class="box" id="tmb"><div id="tm"></div></div></section>
  </div>
</div>
<div class="tools"><button id="cfg" title="Configurar planilha">&#9881;</button></div>

<div id="dlgw"><div id="dlgb">
  <h3 style="margin:0 0 6px">Ligar à planilha</h3>
  <p>Cole aqui o link da planilha publicada como CSV.</p>
  <input id="url" placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=csv">
  <div class="btns"><button id="ok">Salvar</button><button id="cancel">Fechar</button></div>
</div></div>

<script>
var SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTSfAB4chdgkljQrqTZtNfEBmx8r15INtBrkGNI6_8UCb9BwBwSBz0tc9zWWhO5Ru2VOSi75tAbYrWF/pub?gid=1267108866&single=true&output=csv';
var KEY='painelAmigo2';
function $(id){return document.getElementById(id)}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var URLCSV=(SHEET_URL||lsGet(KEY)||'').replace(/^\s+|\s+$/g,'');
var D={verso:[],treino:[],tarefa:[],tema:'',foto:[]};

/* ajuste automático do tamanho do texto */
function fitIn(box,el,base){
  var f=base;el.style.fontSize=f+'vw';
  while(el.offsetHeight>box.clientHeight+1&&f>1){f-=0.1;el.style.fontSize=f+'vw'}
}

/* datas */
function pd(s){
  s=(s||'').replace(/^\s+|\s+$/g,'');var m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return [+m[1],+m[2],+m[3]];
  m=s.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if(m){var y=m[3]?+m[3]:0;if(y&&y<100)y+=2000;return [y,+m[2],+m[1]]}
  return null;
}
function hojeKey(){var n=new Date();return n.getFullYear()*10000+(n.getMonth()+1)*100+n.getDate()}

/* versículo do dia */
function renderVerse(){
  var hoje=hojeKey(),best=null,i;
  for(i=0;i<D.verso.length;i++){var v=D.verso[i];if(v.k<=hoje&&(!best||v.k>=best.k))best=v}
  var tx=$('vtx'),rf=$('vrf');
  if(!best){tx.textContent='Adicione o versículo de hoje na planilha.';rf.textContent=''}
  else{
    var x=best.x,j=Math.max(x.lastIndexOf(' — '),x.lastIndexOf(' – '));
    if(j>0){tx.textContent=x.slice(0,j);rf.textContent=x.slice(j+3)}else{tx.textContent=x;rf.textContent=''}
  }
  fitIn($('vbox'),$('vin'),2.3);
}

/* tarefas importantes */
function renderTarefas(){
  var box=$('tfi');box.innerHTML='';
  if(!D.tarefa.length){var e=document.createElement('div');e.className='muted';e.textContent='Nenhuma tarefa. Adicione na planilha.';box.appendChild(e)}
  for(var i=0;i<D.tarefa.length;i++){
    var t=D.tarefa[i],r=document.createElement('div');r.className='tf'+(t.ok?' done':'');
    var c=document.createElement('div');c.className='ck';c.textContent=t.ok?'\u2713':'';
    var s=document.createElement('span');s.textContent=t.x;
    r.appendChild(c);r.appendChild(s);box.appendChild(r);
  }
  fitIn($('tfb'),box,2.3);
}

/* treino do dia */
function renderTreino(){
  var n=new Date(),hoje=hojeKey(),w=['dom','seg','ter','qua','qui','sex','sab'][n.getDay()];
  var l=D.treino.filter(function(t){return t.k===hoje});
  if(!l.length)l=D.treino.filter(function(t){return !t.k&&t.d===w});
  var box=$('tri');box.innerHTML='';
  if(!l.length){var e=document.createElement('div');e.className='ln muted';e.textContent='Sem treino cadastrado para hoje.';box.appendChild(e)}
  for(var i=0;i<l.length;i++){var d=document.createElement('div');d.className='ln';d.textContent=l[i].x;box.appendChild(d)}
  fitIn($('trb'),box,2.6);
}

function renderAll(){
  renderVerse();renderTarefas();renderTreino();
  $('tm').textContent=D.tema||'Escreva o tema na planilha.';
  fitIn($('tmb'),$('tm'),2.3);
}

/* relógio */
var DIAS=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function p2(n){return n<10?'0'+n:''+n}
var lastDay='';
function tick(){
  var d=new Date();
  $('time').textContent=p2(d.getHours())+':'+p2(d.getMinutes());
  $('date').textContent=DIAS[d.getDay()]+', '+d.getDate()+' de '+MESES[d.getMonth()];
  var h=d.getHours();$('greet').textContent=h<12?'Bom dia!':h<18?'Boa tarde!':'Boa noite!';
  var k=d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
  if(k!==lastDay){lastDay=k;renderAll()}
}

/* planilha */
function csv(t){var r=[],row=[],c='',q=false,i,ch;for(i=0;i<t.length;i++){ch=t.charAt(i);if(q){if(ch=='"'){if(t.charAt(i+1)=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t.charAt(i+1)=='\n')i++;row.push(c);r.push(row);row=[];c=''}else c+=ch}if(c||row.length){row.push(c);r.push(row)}return r}
function norm(s){s=(s||'').toLowerCase();if(s.normalize)s=s.normalize('NFD');return s.replace(/[\u0300-\u036f]/g,'').replace(/^\s+|\s+$/g,'')}
function trim(s){return (s||'').replace(/^\s+|\s+$/g,'')}
function img(u){u=trim(u);var m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?.*id=([\w-]+)/);return m?'https://lh3.googleusercontent.com/d/'+m[1]+'=w1280':u}
function apply(txt){
  var n={verso:[],treino:[],tarefa:[],tema:'',foto:[]},yy=new Date().getFullYear(),rows=csv(txt),i,r,t,h,x,p;
  for(i=0;i<rows.length;i++){
    r=rows[i];t=norm(r[0]);if(!t||t==='tipo')continue;
    h=trim(r[1]);x=trim(r[2]);
    if(t.indexOf('versic')===0||t.indexOf('biblic')===0||t.indexOf('texto')===0){
      p=pd(h);if(p&&x)n.verso.push({k:(p[0]||yy)*10000+p[1]*100+p[2],x:x});
    }else if(t.indexOf('trein')===0){
      if(!x)continue;
      p=pd(h);
      if(p)n.treino.push({k:(p[0]||yy)*10000+p[1]*100+p[2],d:'',x:x});
      else n.treino.push({k:0,d:norm(h).slice(0,3),x:x});
    }else if(t.indexOf('tarefa')===0||t==='todo'){
      if(x)n.tarefa.push({ok:/^(ok|x|feito|feita|concluido|concluida|sim|v|\u2713|\u2714)$/.test(norm(h)),x:x});
    }else if(t.indexOf('tema')===0){
      if(x||h)n.tema=x||h;
    }else if(t==='foto'||t==='fotos'){
      var parts=(x||h).split(/[\s,;]+/);
      for(var k=0;k<parts.length;k++){if(/^https?:/i.test(parts[k]))n.foto.push(img(parts[k]))}
    }
  }
  D=n;renderAll();
  if(pi>=D.foto.length)pi=0;
  $('nop').style.display=D.foto.length?'none':'flex';
  if(!D.foto.length){$('pa').className='ph';$('pb').className='ph'}
}
function load(){
  if(!URLCSV)return;
  var xhr=new XMLHttpRequest();
  xhr.open('GET',URLCSV+(URLCSV.indexOf('?')>-1?'&':'?')+'t='+new Date().getTime(),true);
  xhr.onreadystatechange=function(){
    if(xhr.readyState!==4)return;
    if(xhr.status===200&&xhr.responseText){lsSet(KEY+'d',xhr.responseText);apply(xhr.responseText)}
    else{var c=lsGet(KEY+'d');if(c)apply(c)}
  };
  try{xhr.send()}catch(e){var c=lsGet(KEY+'d');if(c)apply(c)}
}

/* fotos */
var pi=0,front=true;
function alt(u){var m=u.match(/lh3\.googleusercontent\.com\/d\/([\w-]+)/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1280':null}
function show(src){
  var a=$(front?'pb':'pa'),b=$(front?'pa':'pb'),v='url("'+src+'")';
  a.children[0].style.backgroundImage=v;a.children[1].style.backgroundImage=v;
  a.className='ph on';b.className='ph';front=!front;
}
function foto(tries){
  if(!D.foto.length)return;
  tries=tries||0;
  var u=D.foto[pi%D.foto.length];pi=(pi+1)%D.foto.length;
  var im=new Image();
  im.onload=function(){show(im.src)};
  im.onerror=function(){
    var a2=alt(u);
    if(a2){var i2=new Image();i2.onload=function(){show(a2)};i2.onerror=function(){if(tries<D.foto.length)setTimeout(function(){foto(tries+1)},300)};i2.src=a2}
    else if(tries<D.foto.length)setTimeout(function(){foto(tries+1)},300);
  };
  im.src=u;
}

/* configuração */
$('cfg').onclick=function(){$('url').value=URLCSV;$('dlgw').style.display='block'};
$('cancel').onclick=function(){$('dlgw').style.display='none'};
$('ok').onclick=function(){URLCSV=trim($('url').value);lsSet(KEY,URLCSV);$('dlgw').style.display='none';load()};

window.onresize=function(){renderAll()};
tick();
if(!URLCSV){$('dlgw').style.display='block'}else load();
setInterval(tick,1000);
setInterval(load,60*1000);
setInterval(function(){foto()},10000);
setTimeout(function(){foto()},2500);
</script>
</body>
</html>
